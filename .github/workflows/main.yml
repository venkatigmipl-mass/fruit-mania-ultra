name: Build Fruit Mania Ultra APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund


      - name: Build web game
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

